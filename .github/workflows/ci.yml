name: Payment Gateway CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "21"

jobs:
  build-and-test:
    name: Maven Compile and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      # We run tests here dynamically across your codebase to capture regressions
      - name: Build and Test with Maven
        env:
          MAVEN_OPTS: "-Xmx5g"
        run: mvn clean verify -Dnative.skip=true -U

  checkstyle:
    name: Checkstyle CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Run Checkstyle
        env:
          MAVEN_OPTS: "-Xmx5g"
        run: mvn checkstyle:check

  container-build:
    name: Verify JVM Container
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          [
            api-gateway,
            auth-service,
            payment-service,
            merchant-service,
            vault-service,
            notification-service,
            fraud-service,
          ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      # --- STEP A: REGISTRY AUTHENTICATION ---
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- STEP B: BUILD JVM IMAGE VIA DOCKERFILE ---
      - name: Build JVM Container Image via Dockerfile
        env:
          MAVEN_OPTS: "-Xmx6g"
        run: |
          # 1. Ensure shared dependencies are installed locally
          mvn clean install -N -DskipTests
          mvn clean install -pl common -DskipTests

          # 2. Package the specific microservice JAR
          mvn clean package -pl ${{ matrix.service }} -DskipTests

          # 3. Build using your single root Dockerfile (passing root '.' as context)
          docker build \
            -t payment-gateway/${{ matrix.service }}:1.0.0-SNAPSHOT \
            -f Dockerfile \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            .

      # --- STEP C: TAG AND PUSH TO GHCR ---
      - name: Tag and Push JVM Images to GHCR
        if: github.event_name == 'push'
        run: |
          LOCAL_IMAGE="payment-gateway/${{ matrix.service }}:1.0.0-SNAPSHOT"
          TARGET_IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest-jvm"
          TARGET_IMAGE_SHA="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}-jvm"

          docker tag $LOCAL_IMAGE $TARGET_IMAGE_LATEST
          docker tag $LOCAL_IMAGE $TARGET_IMAGE_SHA

          docker push $TARGET_IMAGE_LATEST
          docker push $TARGET_IMAGE_SHA
